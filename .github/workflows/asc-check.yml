# Reads FlipUp's subscriptions and server notification settings from App Store Connect and lists anything that
# doesn't match what the app and the server expect (scripts/ascCheck.mjs). Read-only. Started by hand.
name: App Store Connect check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Write the App Store Connect key
        env:
          KEY: ${{ secrets.APPLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::The APPLE_KEY secret is missing"; exit 1; fi
          umask 077
          printf '%s' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Check
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: node scripts/ascCheck.mjs
