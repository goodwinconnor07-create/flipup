name: BOT_001 learning experiments

on:
  push:
    branches: [main]
    paths:
      - 'src/bot_engine/**'
      - 'scripts/trainBot.ts'
      - 'scripts/evaluatePreflop.ts'
      - 'scripts/evaluatePersonalities.ts'
      - 'scripts/evaluateEveryday.ts'
      - 'scripts/evaluatePlanning.ts'
      - 'scripts/analyseBotRanges.ts'
      - 'scripts/evaluateRealism.ts'
      - 'scripts/calibrateResponses.ts'
      - 'scripts/evaluateCalibrated.ts'
      - 'scripts/auditDecisionQuality.ts'
      - 'scripts/diagnoseHeadsUp.ts'
      - 'scripts/calibrateResponsesV2.ts'
      - 'scripts/reviewHeadsUpDecisions.ts'
      - 'scripts/evaluatePublicBehavior.ts'
      - 'scripts/evaluateLiveExperience.ts'
      - '.github/workflows/bot-training.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: bot-learning-experiments
  cancel-in-progress: false

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: bot-training-output
          key: bot-learning-${{ runner.os }}-${{ hashFiles('src/bot_engine/**', 'scripts/trainBot.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bot-learning-${{ runner.os }}-${{ hashFiles('src/bot_engine/**', 'scripts/trainBot.ts') }}-
      - run: npx vitest run src/bot_engine
      - run: npm run bot:train -- 2 bot-training-output
        env:
          BOT_TRAIN_PAIRS: '250'
      - run: npm run bot:preflop -- 250 bot-training-output/preflop-comparison.json
      - run: npm run bot:personalities -- 100 bot-training-output/personality-comparison.json
      - run: npm run bot:everyday -- 100 bot-training-output/everyday-table.json
      - run: npm run bot:planning -- 50 bot-training-output/planning-comparison.json
      - run: npm run bot:ranges -- bot-training-output/range-analysis.json
      - run: npm run bot:realism -- 50 bot-training-output/realism-comparison.json
      - run: npm run bot:experience -- bot-training-output/live-human-table.json
      - run: npm run bot:behavior -- 300 bot-training-output/public-behavior-accuracy.json test
      - run: npm run bot:compare-responses -- 50 bot-training-output/response-comparison.json behavior-holdout behavior
      - run: npm run bot:decision-quality -- bot-training-output/decision-quality-probes.json
      - run: npm run bot:decision-worlds -- bot-training-output/specified-worlds.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-learning-${{ github.run_id }}
          path: bot-training-output
          retention-days: 30
