# Deploys the GTO coach service (gto/) to Fly whenever it changes on the main branch.
# Needs the FLY_API_TOKEN repository secret.
name: Deploy GTO coach

on:
  push:
    branches: [main]
    paths: ["gto/**", ".github/workflows/deploy-coach.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-coach
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gto
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify deployed service without running a solve
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 15 https://flipup-gto.fly.dev/health
