# Deploys the website and Worker to Cloudflare (npm run deploy). Runs by hand only
# (Actions tab > Deploy > Run workflow). Needs two repository secrets:
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. WAITLIST_TOKEN, when set, is copied to the Worker as the owner's key
# for the waitlist's count and launch email (docs/SUBMISSION.md). Secret values never go in the repository.
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set the waitlist owner key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WAITLIST_TOKEN: ${{ secrets.WAITLIST_TOKEN }}
        run: |
          if [ -z "$WAITLIST_TOKEN" ]; then echo "No WAITLIST_TOKEN secret: skipped."; exit 0; fi
          printf '%s' "$WAITLIST_TOKEN" | npx wrangler secret put WAITLIST_TOKEN
