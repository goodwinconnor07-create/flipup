# Temporary, read-only: copies the solved flop library off the coach's Fly volume into a one-day download.
# Runs once when this file is pushed to the session branch, and is deleted afterwards.
name: Export flop library

on:
  push:
    branches: [claude/keen-edison-djt6gr]
    paths: [".github/workflows/fly-export.yml"]

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Bundle on the coach machine and copy it here
        run: |
          ID=$(flyctl machine list -a flipup-gto --json | jq -r '.[0].id')
          flyctl machine start "$ID" -a flipup-gto || true
          sleep 20
          flyctl ssh console -a flipup-gto -C "sh -c 'tar czf /tmp/flops.tgz -C /app/flipup_gto/data/cache flops && ls -l /tmp/flops.tgz'"
          flyctl ssh sftp get /tmp/flops.tgz ./flops.tgz -a flipup-gto
          flyctl ssh console -a flipup-gto -C "rm -f /tmp/flops.tgz" || true
          ls -l flops.tgz
          sha256sum flops.tgz
      - name: Check what arrived
        run: |
          mkdir out && tar xzf flops.tgz -C out
          for d in out/flops/*/; do echo "$(basename "$d") $(ls "$d" | wc -l)"; done
          du -sh out/flops
      - uses: actions/upload-artifact@v4
        with:
          name: flipup-flop-library
          path: flops.tgz
          retention-days: 1
          if-no-files-found: error
