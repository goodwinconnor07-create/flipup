# Temporary, read-only: counts what the GTO coach has stored on Fly. Runs once when this file is pushed
# to the session branch, prints counts only, and is deleted afterwards.
name: Inspect coach storage

on:
  push:
    branches: [claude/keen-edison-djt6gr]
    paths: [".github/workflows/fly-inspect.yml"]

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Apps and machines
        run: |
          flyctl status -a flipup-gto || true
          flyctl volumes list -a flipup-gto || true
          echo "--- batch app"
          flyctl machine list -a flipup-gto-batch || true
      - name: Count stored files
        run: |
          ID=$(flyctl machine list -a flipup-gto --json | jq -r '.[0].id')
          echo "machine: $ID"
          flyctl machine start "$ID" -a flipup-gto || true
          sleep 20
          S=$(base64 -w0 <<'EOF'
          C=/app/flipup_gto/data/cache
          echo "cache folders:"; ls "$C"
          echo "--- flop files per spot"
          for d in "$C"/flops/*/; do echo "$(basename "$d") $(ls "$d" | wc -l)"; done
          echo "--- sizes"
          du -sh "$C" "$C"/flops 2>/dev/null
          df -h "$C" | tail -1
          EOF
          )
          flyctl ssh console -a flipup-gto -C "sh -c 'echo $S | base64 -d | sh'"
