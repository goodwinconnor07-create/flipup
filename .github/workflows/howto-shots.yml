# Shoots How to Play's pictures on a real iPhone 17 Pro simulator: builds the app for the simulator with the
# recorder mounted (native/scripts/howto/install.mjs, never committed), boots the simulator in dark mode with Apple's
# 9:41 status bar, and lets the recorder play a hand of each game while host.mjs takes `simctl` screenshots. The
# chosen pictures and src/components/how-to/shots.ts are committed back to the branch it ran on. No signing and
# no secrets: a simulator build needs neither. The script is docs/HOW_TO_PLAY.md.
name: How to Play shots

on:
  workflow_dispatch:
    inputs:
      games:
        description: "Games to shoot, separated by spaces (holdem pineapple ...). Empty: all 13."
        type: string
        default: ""
  # While this workflow is being set up on a branch (workflow_dispatch only works once it's on main). Remove before merging.
  push:
    branches: [claude/sweet-fermat-y2mf3j]
    paths: ["native/scripts/howto/**"]

concurrency:
  group: howto-shots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shoot:
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Pick Xcode
        working-directory: .
        # Expo SDK 58 needs Xcode 26.4 or later (see ios-build.yml).
        run: |
          xc=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          case "$xc" in *Xcode_26.[0-3]*) echo "::error::$xc is too old for Expo SDK 58 (needs Xcode 26.4+)"; exit 1;; esac
          sudo xcode-select -s "$xc"
          xcodebuild -version

      - run: npm ci

      - name: Tools
        run: brew install webp

      - name: Mount the recorder
        run: node scripts/howto/install.mjs

      - name: Make the iOS project
        env:
          CI: "1"
        run: |
          npx expo prebuild --platform ios --clean
          # The recorder calls the Mac's host on 127.0.0.1.
          plist=$(ls ios/*/Info.plist | grep -v Pods | head -1)
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity:NSAllowsLocalNetworking" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist"

      - name: Build for the simulator
        run: |
          ws=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$ws" .xcworkspace)
          echo "Building $scheme from $ws"
          set -o pipefail
          xcodebuild -workspace "$ws" -scheme "$scheme" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build | tail -n 60
          app=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)
          echo "APP=$PWD/$app" >> "$GITHUB_ENV"

      - name: Boot an iPhone 17 Pro
        run: |
          udid=$(xcrun simctl list devices available -j | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const all = Object.entries(JSON.parse(s).devices).filter(([r]) => r.includes("iOS")).sort(([a], [b]) => a.localeCompare(b, "en", { numeric: true }));
              const found = all.flatMap(([, ds]) => ds).filter((d) => d.name === "iPhone 17 Pro").pop();
              console.log(found ? found.udid : "");
            });')
          if [ -z "$udid" ]; then
            runtime=$(xcrun simctl list runtimes -j | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).runtimes.filter(r=>r.platform==="iOS"&&r.isAvailable).pop();console.log(r?r.identifier:"")})')
            udid=$(xcrun simctl create "iPhone 17 Pro" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$runtime")
          fi
          echo "Simulator $udid"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance dark
          xcrun simctl status_bar "$udid" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$udid" "$APP"
          # A fresh simulator drops in a one-off "Ready for Apple Intelligence" notification a little after it boots:
          # let that come and go before the app opens (host.mjs also retakes any picture a banner covers).
          sleep 90

      - name: Shoot
        env:
          GAMES: ${{ inputs.games }}
          SHOTS_WORK: ${{ runner.temp }}/howto-work
        run: |
          if [ -z "$GAMES" ] && [ -f scripts/howto/try-games ]; then GAMES=$(cat scripts/howto/try-games); fi
          node scripts/howto/host.mjs "$UDID" $GAMES > "$RUNNER_TEMP/host.log" 2>&1 &
          host=$!
          sleep 2
          xcrun simctl launch "$UDID" com.goodwin.flipup
          # The recorder tells the host when it's done; give up after 150 minutes.
          for i in $(seq 1 1800); do
            if ! kill -0 $host 2>/dev/null; then break; fi
            sleep 5
          done
          kill $host 2>/dev/null || true
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/howto-work/last.png" || true
          cat "$RUNNER_TEMP/host.log"
          grep -q "] done" "$RUNNER_TEMP/host.log"

      - name: Keep every picture taken
        if: always()
        uses: actions/upload-artifact@v4 # pin to a commit SHA when convenient, like the others
        with:
          name: howto-work
          path: ${{ runner.temp }}/howto-work
          retention-days: 7

      - name: Commit the pictures
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git checkout -- src/app/_layout.tsx
          rm -f src/howto-recorder.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/howto src/components/how-to/shots.ts
          if git diff --cached --quiet; then echo "No new pictures."; exit 0; fi
          git commit -m "How to Play: new pictures from the iPhone 17 Pro simulator"
          git pull --rebase --autostash origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
