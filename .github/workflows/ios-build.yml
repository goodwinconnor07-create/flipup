# Builds the iPhone and iPad app with EAS, and sends it to App Store Connect only when asked.
# Runs by hand only (Actions tab > iOS build > Run workflow). Nothing builds or submits on push.
# "where": github-mac builds on GitHub's own macOS runner with eas build --local (no Expo build used); expo uses EAS's servers.
# Secret values never go into the repository or the logs: the App Store Connect key is written to a temp
# file outside the checkout, with `printf`, and the last step deletes it whatever happened before.
name: iOS build

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Send the finished build to App Store Connect (needs the owner's approval first)
        type: boolean
        default: false
      profile:
        description: EAS build profile from native/eas.json
        type: string
        default: production
      where:
        description: "Where to build: on Expo's servers (counts toward the monthly Expo build limit) or on GitHub's own Mac (doesn't)"
        type: choice
        options:
          - expo
          - github-mac
        default: github-mac

# One iOS build at a time. A second run waits for the first instead of cancelling it.
concurrency:
  group: ios-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # GitHub's Mac builds the app itself (eas build --local), so it doesn't use an Expo build; Expo's servers do.
    runs-on: ${{ inputs.where == 'github-mac' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: native
    steps:
      - name: Check the secrets are set
        # Prints only the names of missing secrets, never a value.
        working-directory: .
        env:
          APPLE_KEY: ${{ secrets.APPLE_KEY }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_API_TOKEN: ${{ secrets.EXPO_API_TOKEN }}
        run: |
          missing=""
          for name in APPLE_KEY APPLE_KEY_ID APPLE_ISSUER_ID APPLE_TEAM_ID EXPO_API_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "All five secrets are set."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: native/package-lock.json

      - uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9
        with:
          eas-version: 27.2.0
          token: ${{ secrets.EXPO_API_TOKEN }}

      - name: Use the newest Xcode (GitHub's Mac only)
        if: ${{ inputs.where == 'github-mac' }}
        working-directory: .
        run: |
          xc=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $xc"
          sudo xcode-select -s "$xc"
          xcodebuild -version

      - run: npm ci

      - name: Check the Expo account
        # Prints the account name the token belongs to (not a secret), or fails if the token doesn't work.
        run: eas whoami

      - name: Create or link the EAS project
        # eas init can't edit a TypeScript app config, but it creates (or finds) the project first and prints its ID.
        # The ID isn't a secret: copy it into easProjectId in native/appInfo.ts so later runs skip this step.
        run: |
          id=$(npx expo config --type public --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).extra?.eas?.projectId ?? ""))')
          if [ -z "$id" ]; then
            eas init --non-interactive --force > "$RUNNER_TEMP/eas-init.log" 2>&1 || true
            id=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$RUNNER_TEMP/eas-init.log" | head -1)
            if [ -z "$id" ]; then cat "$RUNNER_TEMP/eas-init.log"; echo "::error::eas init didn't give a project ID"; exit 1; fi
            echo "::notice::EAS project ID $id. Copy it into easProjectId in native/appInfo.ts."
          fi
          echo "EAS_PROJECT_ID=$id" >> "$GITHUB_ENV"
          # EAS's own builders read the app config too, so put the ID in this run's copy of appInfo.ts.
          sed -i "s/easProjectId: '',/easProjectId: '$id',/" appInfo.ts

      - name: Check the app config
        run: |
          npx expo config --type public --json > "$RUNNER_TEMP/expo-config.json"
          node -e '
            const c = require(process.argv[1]);
            const gaps = [];
            if (!c.ios?.bundleIdentifier) gaps.push("bundleId");
            if (!c.extra?.eas?.projectId) gaps.push("easProjectId");
            if (gaps.length) { console.log(`::error::Fill in ${gaps.join(" and ")} in native/appInfo.ts`); process.exit(1); }
            console.log(`Building ${c.name} (${c.ios.bundleIdentifier}), EAS project ${c.extra.eas.projectId}`);
          ' "$RUNNER_TEMP/expo-config.json"

      - name: Write the App Store Connect key
        env:
          KEY: ${{ secrets.APPLE_KEY }}
        run: |
          umask 077
          printf '%s' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Normal App Store signing. (Only IN_HOUSE changes anything: it means an Enterprise in-house team.)
          EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION
          # Lets EAS make or refresh the signing certificate and profile without a person at the keyboard.
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          EXPO_ASC_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          PROFILE: ${{ inputs.profile }}
          WHERE: ${{ inputs.where }}
        run: |
          if [ "$WHERE" = "github-mac" ]; then
            eas build --platform ios --profile "$PROFILE" --non-interactive --local --output "$RUNNER_TEMP/FlipUp.ipa"
          else
            eas build --platform ios --profile "$PROFILE" --non-interactive
          fi

      - name: Keep the .ipa (GitHub's Mac only)
        if: ${{ inputs.where == 'github-mac' }}
        uses: actions/upload-artifact@v4 # pin to a commit SHA when convenient, like the others
        with:
          name: FlipUp-ipa
          path: ${{ runner.temp }}/FlipUp.ipa
          retention-days: 7

      - name: Submit to App Store Connect
        if: ${{ inputs.submit == true }}
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          # The names EAS CLI itself reads.
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          EXPO_ASC_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Normal App Store signing. (Only IN_HOUSE changes anything: it means an Enterprise in-house team.)
          EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION
        # The App Store Connect app ID is in native/eas.json. EAS won't set the API key up by itself in CI, so this
        # run's copy of eas.json points at the key file (never committed, never printed).
        run: |
          node -e '
            const fs = require("fs"); const j = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            Object.assign(j.submit.production.ios, { ascApiKeyPath: process.env.ASC_KEY_PATH, ascApiKeyId: process.env.ASC_KEY_ID, ascApiKeyIssuerId: process.env.ASC_ISSUER_ID });
            fs.writeFileSync("eas.json", JSON.stringify(j, null, 2));
          '
          if [ "${{ inputs.where }}" = "github-mac" ]; then
            eas submit --platform ios --path "$RUNNER_TEMP/FlipUp.ipa" --non-interactive
          else
            eas submit --platform ios --latest --non-interactive
          fi

      - name: Delete the App Store Connect key
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
