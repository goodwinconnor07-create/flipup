# Screenshots of the real iPhone app (the iOS Simulator on GitHub's Mac), for reviewing a design on a branch before
# it's merged. Builds a Release Simulator app (no signing, no Expo build), loads demo data, takes the screens in light
# and dark mode with native/scripts/ios-screens.sh, and commits the PNGs to docs/design/screens/ on the same branch.
name: iOS screenshots

on:
  workflow_dispatch:
  push:
    branches: [claude/exciting-mccarthy-eii0qw]
    paths: ['native/**', 'src/**', '.github/workflows/ios-screens.yml']

concurrency:
  group: ios-screens-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 100
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/package-lock.json

      - name: Pick Xcode
        working-directory: .
        run: |
          xc=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $xc"
          sudo xcode-select -s "$xc"
          xcodebuild -version

      - name: Install
        run: |
          (cd .. && npm ci --no-audit --no-fund)
          npm ci --no-audit --no-fund

      - name: Boot an iPhone
        run: |
          xcrun simctl list devices available
          DEV=$(xcrun simctl list devices available -j | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const all=Object.entries(JSON.parse(s).devices).filter(([r])=>r.includes("iOS")).sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true})).flatMap(([,d])=>d);
              const pick=[...all].reverse().find(d=>d.name==="iPhone 17 Pro")||[...all].reverse().find(d=>/^iPhone \d+ Pro$/.test(d.name))||[...all].reverse().find(d=>d.name.startsWith("iPhone"));
              console.log(pick.udid);
            });')
          echo "DEV=$DEV" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b

      - name: Prebuild
        run: npx expo prebuild --platform ios --no-install && (cd ios && pod install)

      - name: Build for the Simulator
        run: |
          ws=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$ws" .xcworkspace)
          set -o pipefail
          xcodebuild -workspace "$ws" -scheme "$scheme" -configuration Release -sdk iphonesimulator \
            -destination "id=$DEV" -derivedDataPath build CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build | tail -n 80

      - name: Install Maestro
        continue-on-error: true
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Take the screenshots
        env:
          OUT: ${{ github.workspace }}/docs/design/screens
        run: ./scripts/ios-screens.sh

      - name: Keep the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-screens
          path: docs/design/screens
          retention-days: 7

      - name: Commit them to the branch
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/screens
          git diff --cached --quiet && exit 0
          git commit -m "iOS Simulator screenshots of ${GITHUB_SHA::7}"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done
          exit 1
