      <rect x="-120" y="-170" width="240" height="340" rx="30" fill="#f4f1ff"/>
      <rect x="-104" y="-154" width="208" height="308" rx="20" fill="url(#back)"/>
      <rect x="-104" y="-154" width="208" height="308" rx="20" fill="url(#lattice)"/>
      <rect x="-80" y="-130" width="160" height="260" rx="12" fill="none" stroke="#ffc933" stroke-width="6" opacity="0.85"/>
    </g>
    <!-- body -->
    <path fill="url(#body)" d="M290 520 C290 330 385 205 500 205 C615 205 710 330 710 520 L710 770 Q657.5 850 605 770 Q552.5 850 500 770 Q447.5 850 395 770 Q342.5 850 290 770 Z"/>
    <path fill="url(#shade)" d="M290 520 C290 330 385 205 500 205 C615 205 710 330 710 520 L710 770 Q657.5 850 605 770 Q552.5 850 500 770 Q447.5 850 395 770 Q342.5 850 290 770 Z"/>
    <ellipse cx="390" cy="320" rx="46" ry="74" fill="#fff" opacity="0.8" transform="rotate(30 390 320)"/>
