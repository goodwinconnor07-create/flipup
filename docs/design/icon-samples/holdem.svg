    <symbol id="A" viewBox="-40 -52 80 104"><path fill-rule="evenodd" stroke-linejoin="round" stroke-width="7" d="M-36 48 L-10 -48 L10 -48 L36 48 L18 48 L12 26 L-12 26 L-18 48 Z M-7 10 L7 10 L0 -17 Z"/></symbol>
