    <use href="#spade" x="-150" y="-70" width="170" height="164" fill="url(#ink)"/><ellipse cx="-90" cy="-30" rx="22" ry="12" fill="#fff" opacity="0.25" transform="rotate(-30 -90 -30)"/>
