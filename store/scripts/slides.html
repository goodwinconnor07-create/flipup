<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1320px;height:2868px;overflow:hidden;position:relative;font-family:'Inter Display',Inter,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--ink)}
body.dark{--bg:#05060a;--ink:#fff;--mute:#8d93a5;--shadow:rgba(0,0,0,.6);--bubble:#fff;--tileink:#d5d9e4}
body.light{--bg:#ffffff;--ink:#0a0a0a;--mute:#6e7381;--shadow:rgba(20,30,60,.22);--bubble:#fff;--tileink:#3a3f4b}
.glow{position:absolute;inset:0}
body.light .glow{display:none}
h1{position:absolute;left:90px;right:90px;text-align:center;font-weight:700;letter-spacing:-0.035em;line-height:1.02;font-size:128px}
h1 span{color:var(--mute)}
/* The screen (the phone less 34px a side) is exactly an iPhone screenshot's shape, 402 x 874, so a shot fills it to the bottom edge. */
.phone{position:absolute;width:1010px;height:2116px;border-radius:168px;padding:22px;
 background:linear-gradient(135deg,#8b8f97,#3a3d44 30%,#25272c 60%,#6d7178)}
.phone:before{content:'';position:absolute;inset:10px;border-radius:158px;background:#0a0a0b}
.screen{position:absolute;inset:34px;border-radius:136px;overflow:hidden;background:#000}
.screen img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.island{position:absolute;top:34px;left:50%;transform:translateX(-50%);width:290px;height:86px;border-radius:43px;background:#000;z-index:2}
.dim:after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.55)}
.btn{position:absolute;width:10px;border-radius:4px;background:#4a4d54}
.panel{position:absolute;background:#000;border:2px solid rgba(255,255,255,.14);border-radius:90px;overflow:hidden;text-align:center;color:#fff}
.panel .lbl{font-size:56px;font-weight:500;color:#8e8e93}
.bub{position:absolute;display:flex;align-items:center;gap:26px;padding:22px 52px 22px 22px;border-radius:999px;background:#fff;font-weight:600;font-size:58px;color:#111;letter-spacing:-.02em}
body.light .bub{background:#f2f2f7}
.bub .face{width:108px;height:108px;border-radius:50%;background:#e9edf6;display:grid;place-items:center}.bub .face img{width:84px;height:84px;object-fit:contain}
body.light .bub .face{background:#fff}
.bub small{display:block;font-size:36px;font-weight:500;color:#7a7f8a;letter-spacing:0;margin-bottom:4px}
.tile{position:absolute;width:330px;text-align:center}
.tile .sq{width:330px;height:330px;border-radius:84px;display:grid;place-items:center}
.tile .sq svg{width:300px;height:300px}
.tile .nm{margin-top:22px;font-size:40px;font-weight:600;color:var(--tileink);letter-spacing:-.01em;white-space:nowrap}
.ptag{position:absolute;left:50%;top:96px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:12px 30px 12px 24px;border-radius:999px;background:#f5b700;color:#3a2600;font-size:38px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.ptag svg{width:42px;height:42px;margin-top:-4px}
</style></head><body class="__THEME__">__BODY__</body></html>
